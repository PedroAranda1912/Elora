spring.application.name=Elora
server.port=8080

# Configuração local opcional; o arquivo backend/.env é ignorado pelo Git.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL (principal). Configure estes valores por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elora}
spring.datasource.username=${DB_USERNAME:elora}
spring.datasource.password=${DB_PASSWORD:elora_dev}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: configure um segredo forte por ambiente, nunca no código.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
elora.cors.allowed-origins=${ELORA_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080}

# Dados de demonstração (contas, anúncios, pedidos...). Com ELORA_DEMO_SEED=true, o app popula o banco
# na inicialização, uma única vez: se as contas de demonstração já existirem, nada é alterado.
elora.demo.seed.enabled=${ELORA_DEMO_SEED:false}
elora.demo.seed.password=${ELORA_DEMO_PASSWORD:Elora@2026}
elora.demo.seed.image-base-url=${ELORA_DEMO_IMAGE_BASE_URL:http://localhost:${server.port}}

# Imagens enviadas por vendedores e prestadores
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
elora.upload-dir=${ELORA_UPLOAD_DIR:./uploads}

# E-mail transacional pelo Brevo. Sem credenciais, o checkout segue funcionando sem envio.
elora.email.brevo.api-key=${ELORA_BREVO_API_KEY:}
elora.email.brevo.sender-email=${ELORA_BREVO_SENDER_EMAIL:}
elora.email.brevo.sender-name=${ELORA_BREVO_SENDER_NAME:Elora}
